# Backend stack.
#
# Local development (unchanged behaviour):
#   docker compose up -d        -> db + redis only (profile-independent services)
#
# Full production-like stack (profile "full"):
#   docker compose --profile full up --build -d
#     -> db + redis + migrate (one-shot) + web (gunicorn) + worker + beat + nginx
#     -> http://127.0.0.1:8080 (nginx) is the only public entry point
#
# Every host port stays bound to 127.0.0.1. See deploy/README.md.

x-backend-environment: &backend-environment
  # --- runtime mode: production path in config/settings.py -------------
  DJANGO_ENV: production
  DEBUG: "False"
  # --- database: the `db` service, not localhost ------------------------
  DB_ENGINE: postgres
  DB_HOST: db
  DB_PORT: "5432"
  # --- broker + throttle counters: the `redis` service, WITH password ----
  # redis starts with --requirepass when REDIS_PASSWORD is set in .env;
  # the entrypoint refuses to start a backend service without it.
  REDIS_URL: "redis://:${REDIS_PASSWORD:-}@redis:6379/0"
  # --- behind nginx: exactly 1 proxy in front of gunicorn ---------------
  # nginx OVERWRITES X-Forwarded-For with the connection peer (deploy/
  # nginx.conf), so the header holds ONE address: the real client IP.
  # NUM_PROXIES=1 makes DRF read that trusted value (it takes the LAST
  # element) as the throttle key instead of the nginx container address.
  NUM_PROXIES: "1"
  USE_X_FORWARDED_PROTO: "True"
  # --- paths inside the container ---------------------------------------
  STATIC_ROOT: /app/staticfiles
  MODELS_DIR: /app/models
  # Screenshots are written by the worker (rw) and read back by the web
  # process through GET /api/scans/{uuid}/screenshot/ (ro). Never exposed
  # as a static/media URL.
  MEDIA_ROOT: /app/media
  SCREENSHOT_RETENTION_DAYS: ${SCREENSHOT_RETENTION_DAYS:-30}
  # Golden-sample bundle for `manage.py demo_setup` / `load_demo_samples`
  # (docs/DEMO_RUNBOOK.md). Only `web` mounts the host folder READ-ONLY at
  # this path (see the web volumes); the host side comes from .env.
  DEMO_SAMPLES_DIR: /app/demo_samples
  # --- collector sandbox (US17 / US26, only the worker reaches it) -------
  # The worker calls http://collector:8000 on collect_net (the collector
  # publishes no port). The overlay collector/docker-compose.collector.yml
  # attaches the worker to that network.
  COLLECTOR_URL: ${COLLECTOR_URL:-http://collector:8000}
  COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:-}
  COLLECTOR_TIMEOUT: ${COLLECTOR_TIMEOUT:-30}
  # --- inference service (internal network only, never on the host) -----
  # The Celery worker calls http://inference:8000 with the shared secret
  # header; the real pipeline (collector + inference) is wired in the
  # worker tasks (scans.run_scan).
  INFERENCE_URL: http://inference:8000
  INFERENCE_API_KEY: ${INFERENCE_API_KEY:?INFERENCE_API_KEY must be set in .env}
  INFERENCE_TIMEOUT: ${INFERENCE_TIMEOUT:-30}

services:
  # ============================ dev services (no profile) ==============
  db:
    image: postgres:16
    container_name: pishing_db
    restart: unless-stopped
    env_file:
      - .env
    # Compose interpolates these from .env (project directory); no $$ escapes.
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-phishing_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pishing_redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Bind Redis to localhost only.
    # Authentication is switched on as soon as REDIS_PASSWORD is set in .env:
    # the full profile requires it (deploy/docker-entrypoint.sh fails fast
    # without it), while a dev .env without the key keeps plain redis-server.
    # Every REDIS_URL therefore carries the password (see .env).
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD" --protected-mode yes; else exec redis-server; fi'
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # PONG only when the answer to AUTH is right; NOAUTH/gone-wrong => unhealthy.
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================ profile "full" =========================
  # One-shot: schema + static files. Services that serve traffic depend on
  # `service_completed_successfully`, so migrations run exactly once per
  # `up`, never silently inside a web/worker/beat start.
  migrate:
    profiles: ["full"]
    image: phishing-backend:local
    env_file:
      - .env
    environment: *backend-environment
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    image: phishing-backend:local
    env_file:
      - .env
    environment: *backend-environment
    command:
      - sh
      - -c
      - exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers "${GUNICORN_WORKERS:-3}" --timeout "${GUNICORN_TIMEOUT:-60}" --access-logfile - --error-logfile -
    volumes:
      - models_volume:/app/models:ro
      # Screenshots are read back (never written) by gunicorn.
      - media_volume:/app/media:ro
      # Golden samples (git-ignored bundle): READ-ONLY, demo_setup only.
      - ${DEMO_SAMPLES_DIR:-./ml_artifacts/golden}:/app/demo_samples:ro
    # automation_net is shared ONLY with n8n and the worker: n8n calls
    # http://web:8000, and no other service ever sees the automation network.
    networks:
      - default
      - automation_net
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/health/', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  worker:
    profiles: ["full"]
    image: phishing-backend:local
    env_file:
      - .env
    environment: *backend-environment
    command:
      - sh
      - -c
      - exec celery -A config worker --concurrency "${CELERY_CONCURRENCY:-2}" --loglevel info
    volumes:
      - models_volume:/app/models:ro
      # The worker WRITES the screenshots captured by the collector.
      - media_volume:/app/media
      # Golden samples (git-ignored bundle): READ-ONLY. demo_setup runs HERE
      # (not in web): it writes demo screenshots under media_volume, and web
      # mounts /app/media read-only on purpose (gunicorn never writes).
      - ${DEMO_SAMPLES_DIR:-./ml_artifacts/golden}:/app/demo_samples:ro
    # automation_net: the worker shares it with web and n8n (n8n may trigger
    # scans through the API); collect_net still comes from the collector overlay.
    networks:
      - default
      - automation_net
    # The image HEALTHCHECK probes :8000 (gunicorn): meaningless for a
    # worker, so it is disabled here instead of staying "unhealthy".
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  beat:
    profiles: ["full"]
    image: phishing-backend:local
    env_file:
      - .env
    environment: *backend-environment
    # Schedule file lives in /tmp on purpose: beat holds the last-run times
    # in memory for relative schedules, and /tmp is the only writable path
    # of the non-root image besides /home/app.
    command:
      - sh
      - -c
      - exec celery -A config beat --loglevel info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    profiles: ["full"]
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    # End-to-end check: the request is proxied to gunicorn and must answer 200.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # ========================= n8n (automation, US-Could) ================
  # Self-hosted workflow automation, isolated on automation_net ONLY.
  # It shares that bridge with `web` and `worker`; it is deliberately NOT
  # on the default network (no route to db / redis / inference) and NOT on
  # collect_net. Its own database lives in the n8n_data volume (SQLite).
  # The owner account is created in the editor on first visit: no legacy
  # basic-auth variables are used.
  # Tag pinned to the latest stable release (2026-11-04): no "latest".
  n8n:
    profiles: ["full"]
    image: docker.n8n.io/n8nio/n8n:2.46.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # REQUIRED: compose refuses to start with a clear message when empty.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set in .env}
      # Access URL for the local plain-HTTP editor + webhooks.
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Listen on IPv4 so other containers can reach http://n8n:5678.
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Africa/Tunis}
      # Plain HTTP locally only: secure cookies would require HTTPS.
      N8N_SECURE_COOKIE: "false"
      # No telemetry, no new-version notifications.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Keep 7 days of execution data (168 hours).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - automation_net
    mem_limit: "1g"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ===================== Mailpit (local fake SMTP) ====================
  # Dev/demo inbox for the backend emails. It joins automation_net ONLY,
  # together with n8n, web and worker: db, redis, inference and collector
  # cannot resolve or reach it. The SMTP port 1025 is NEVER published; only
  # the UI/API is bound to 127.0.0.1:8025. Messages are kept in memory by
  # default (no volume), which is what a disposable test inbox needs.
  # Official image, tag pinned to the latest stable release (v1.33.0,
  # published 2026-10-31): no "latest". Runtime variables below are the
  # documented Mailpit ones (MP_MAX_MESSAGES, MP_DISABLE_VERSION_CHECK).
  mailpit:
    profiles: ["full"]
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - automation_net
    mem_limit: "256m"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:8025/livez || exit 1"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ======================= inference service (US26) ===================
  # Separate CPU FastAPI service (PyTorch). The bundle (backend/ml_artifacts)
  # is mounted READ-ONLY; the image never contains weights. The port is NOT
  # published: only containers on this compose network reach
  # http://inference:8000. /predict requires the X-API-Key shared secret.
  inference:
    profiles: ["full"]
    build:
      context: ../inference
      dockerfile: Dockerfile
      target: runtime
    image: phish360-inference:local
    env_file:
      - .env
    environment:
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?INFERENCE_API_KEY must be set in .env}
      ARTIFACTS_DIR: /artifacts
      PREDICT_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT:-30}
    volumes:
      - ./ml_artifacts:/artifacts:ro
    mem_limit: "3g"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  # One-shot acceptance suite (golden samples + error cases). Runs on the
  # internal network against the healthy service; never publishes a port.
  inference-tests:
    profiles: ["full"]
    build:
      context: ../inference
      dockerfile: Dockerfile
      target: test
    image: phish360-inference-tests:local
    environment:
      INFERENCE_URL: http://inference:8000
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?INFERENCE_API_KEY must be set in .env}
      ARTIFACTS_DIR: /artifacts
    volumes:
      - ./ml_artifacts:/artifacts:ro
    depends_on:
      inference:
        condition: service_healthy
    restart: "no"

volumes:
  pg_data:
  static_volume:
  models_volume:
  media_volume:
  n8n_data:

networks:
  # Bridge shared ONLY by n8n, web and worker. n8n never joins `default`,
  # so it cannot resolve or reach db, redis, inference or the collector.
  automation_net:
    driver: bridge
