          readOnly: true
        model_version:
          type: string
          readOnly: true
        partial:
          type: boolean
          readOnly: true
          title: Partial result
        reason_code:
          type: string
          readOnly: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - detection_source
      - finished_at
      - model_version
      - partial
      - reason_code
      - score
      - status
      - verdict
