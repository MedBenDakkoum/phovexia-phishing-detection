        Read-only projection of a scan (list and detail).

        Step 8a: `id` is the public UUID (`public_id`), never the sequential
        integer primary key, which stays internal (ISO-6.6 anti-enumeration).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        domain:
          type: string
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ScanStatusEnum'
          readOnly: true
        verdict:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ScanVerdictEnum'
          - $ref: '#/components/schemas/NullEnum'
        score:
          type: number
          format: double
          readOnly: true
          nullable: true
        model_verdict:
          type: string
          readOnly: true
          nullable: true
        model_score:
          type: number
          format: double
          readOnly: true
          nullable: true
        policy_flags:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        detection_source:
          type: string
          readOnly: true
        model_version:
          type: string
          readOnly: true
        final_url:
          type: string
          readOnly: true
        partial:
          type: boolean
          readOnly: true
        reason_code:
          type: string
          readOnly: true
        signals:
          type: object
          additionalProperties: {}
          readOnly: true
        probabilities:
          type: object
          additionalProperties: {}
          readOnly: true
        has_screenshot:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        has_report:
          type: boolean
          readOnly: true
          default: false
        report_status:
          type: string
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - detection_source
      - domain
      - final_url
      - finished_at
      - has_report
      - has_screenshot
      - id
      - mode
      - model_score
      - model_verdict
      - model_version
      - partial
      - policy_flags
      - probabilities
      - reason_code
      - report_status
      - reviewed_at
      - score
      - signals
      - status
      - url
      - verdict
    ScanCreate:
      type: object
      description: 'POST /api/scans/ body: {"url": "..."} and nothing else.'
      properties:
        url:
          type: string
      required:
      - url
    ScanCreated:
      type: object
      description: |-
        202 body of POST /api/scans/: the created scan + the quota after it.

        Step 8a: `id` is the public UUID, matching the detail URL /api/scans/<uuid>/.
        Step 11: `detection_source` distinguishes a model verdict from an immediate
        blocklist hit (US41).
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          maxLength: 2048
        status:
          type: string
          maxLength: 20
        detection_source:
          type: string
          maxLength: 20
        model_version:
          type: string
          default: ''
          maxLength: 50
        created_at:
          type: string
          format: date-time
        quota:
          $ref: '#/components/schemas/Quota'
      required:
      - created_at
      - detection_source
      - id
      - quota
      - status
      - url
    ScanError:
      type: object
      description: |-
        400 body: machine-readable `code` (RejectionCode) + human `detail`.

        Schema-only: the view builds this dictionary by hand, the serializer is
        never instantiated (the optional `errors` payload is a free-form dict).
      properties:
        code:
          type: string
        detail:
          type: string
        errors:
          type: object
          additionalProperties: {}
      required:
      - code
      - detail
    ScanStatusEnum:
      enum:
      - submitted
      - analyzing
      - detected
      - under_review
      - confirmed
      - false_positive
      - blocked
      - failed
      type: string
      description: |-
        * `submitted` - Submitted
        * `analyzing` - Analyzing
        * `detected` - Detected
        * `under_review` - Under Review
        * `confirmed` - Confirmed
        * `false_positive` - False Positive
        * `blocked` - Blocked
        * `failed` - Failed
    ScanVerdictEnum:
      enum:
      - phishing
      - legitimate
      - uncertain
      type: string
      description: |-
        * `phishing` - Phishing
        * `legitimate` - Legitimate
        * `uncertain` - Uncertain
    ScopesEnum:
      enum:
      - scan:create
      - scan:read
      - monitor:read
      type: string
      description: |-
        * `scan:create` - Create scans
        * `scan:read` - Read scans
        * `monitor:read` - Read monitoring endpoints
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        email_notifications:
          type: boolean
      required:
      - date_joined
      - email
      - id
      - role
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Clé API : en-tête `Authorization` avec le préfixe `Api-Key `,
        puis le secret. Accepté uniquement sur `POST /api/scans/` et `GET /api/scans/{public_id}/`
        (le secret n''est montré qu''une fois, à la création).'
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
