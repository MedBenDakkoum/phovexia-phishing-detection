openapi: 3.0.3
info:
  title: Phishing Multimodal API
  version: 0.1.0
paths:
  /api/admin/api-keys/:
    get:
      operationId: admin_api_keys_list
      description: Ni le secret ni son hash ne figurent jamais dans la liste.
      summary: Lister les clés API (US54)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiKeyList'
          description: ''
    post:
      operationId: admin_api_keys_create
      description: 'Le champ `secret` n''apparaît QUE dans cette réponse de création
        et n''est jamais stocké (SHA-256 seulement). Portées : `scan:create`, `scan:read`,
        `monitor:read` (lecture seule : `GET /api/admin/health/` et `GET /api/admin/dashboard/`).
        Audit : `apikey.created` (préfixe seulement, jamais le secret).'
      summary: Créer une clé API (US54)
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
        required: true
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
  /api/admin/api-keys/{public_id}/:
    delete:
      operationId: admin_api_keys_destroy
      description: 'Soft revoke : `is_active = false` + `revoked_at` (la ligne est
        conservée). Une clé révoquée est refusée avec 401. Audit : `apikey.revoked`.'
      summary: Révoquer une clé API (US54)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
  /api/admin/dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      description: Totaux, répartition par verdict/statut/source, taux de phishing,
        taux de faux positifs = FALSE_POSITIVE / (CONFIRMED + FALSE_POSITIVE), reviews
        en attente, médiane de durée (Python, 10 000 scans finis max), scans par jour
        (fuseau du projet), top 10 des domaines phishing, utilisateurs par rôle et
        nombre de quick checks. Agrégats uniquement, cache 60 s par période.
      summary: Tableau de bord administrateur (US45)
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Date de début YYYY-MM-DD (fuseau TIME_ZONE), avec `to`.
      - in: query
        name: period
        schema:
          type: string
          enum:
          - 30d
          - 7d
          - 90d
        description: Fenêtre glissante (défaut 30d).
      - in: query
        name: to
        schema:
          type: string
        description: Date de fin YYYY-MM-DD (incluse), avec `from`.
      tags:
      - admin
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
  /api/admin/health/:
    get:
      operationId: admin_health_retrieve
      description: 'Base (ping), Redis (ping), workers Celery (inspect().ping(), timeout
        1 s, « unreachable » au lieu d''une erreur), longueur de file Redis, scans
        bloqués en ANALYZING au-delà de ANALYZING_STUCK_MINUTES, dernier scan terminé,
        version de modèle active. Chaque contrôle renvoie ok/message : jamais d''échec
        de la requête, jamais de secret ni de pile d''appels.'
      summary: Santé détaillée du système (US53)
      tags:
      - admin
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealth'
          description: ''
  /api/admin/integrations/:
    get:
      operationId: admin_integrations_retrieve
      description: 'Instantané en lecture seule : activée ou non, hôte du webhook
        (nom d''hôte uniquement), joignabilité (`/healthz`, timeout 2 s, jamais d''erreur),
        URL publique de l''éditeur n8n, compteurs livrés/échoués sur 24 h et 20 derniers
        événements issus de l''audit. Jamais de secret ni d''URL webhook complète.'
      summary: État de l'intégration n8n
      tags:
      - admin
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatus'
          description: ''
  /api/admin/integrations/test/:
    post:
      operationId: admin_integrations_test_create
      description: 'Émet un `test.event` strictement identique à celui de `manage.py
        send_test_event` (mise en file après commit, aucun destinataire choisi par
        le client). Réponse 202 immédiate : `queued`, `event_id`, `detail`. Limitée
        à 5/min par admin. Intégration désactivée : 202 avec `queued=false`, aucun
        envoi.'
      summary: Envoyer un événement de test n8n
      tags:
      - admin
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationTestResult'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
  /api/admin/models/:
    get:
      operationId: admin_models_list
      description: Réservé aux administrateurs, du plus récent au plus ancien.
      summary: Lister les versions du modèle (US48)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedModelVersionList'
          description: ''
    post:
      operationId: admin_models_create
      description: Métadonnées uniquement (pas d'upload). `file_path` est relatif
        à `MODELS_DIR` (path traversal refusé), le fichier doit exister pour un modèle
        ONNX, et `sha256` est calculé quand le fichier existe. (name, version) doit
        être unique (409 `already_exists`).
      summary: Enregistrer une version du modèle (US48)
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelVersionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModelVersionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModelVersionCreate'
        required: true
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
  /api/admin/models/{public_id}/:
    get:
      operationId: admin_models_retrieve
      description: GET /api/admin/models/{uuid}/ - one version (US48).
      summary: Détail d'une version du modèle (US48)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
          description: ''
  /api/admin/models/{public_id}/activate/:
    post:
      operationId: admin_models_activate_create
      description: 'Transaction verrouillée : la version précédente est désactivée
        PUIS la nouvelle activée (BR-11 = une seule active). Le SHA-256 du fichier
        est revérifié avant l''activation. Audit : `model.activated`.'
      summary: Activer une version du modèle (US48 / BR-11)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelVersion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModelVersion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModelVersion'
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
  /api/admin/models/compare/:
    get:
      operationId: admin_models_compare_retrieve
      description: Métriques côte à côte + écart par rapport à la PREMIERE valeur
        de `ids`. 400 si moins de 2 identifiants ou identifiant inconnu.
      summary: Comparer des versions du modèle (US49)
      parameters:
      - in: query
        name: ids
        schema:
          type: string
        description: Liste d'UUID publics séparés par des virgules (>= 2).
        required: true
      tags:
      - admin
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCompare'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
  /api/admin/models/rollback/:
    post:
      operationId: admin_models_rollback_create
      description: 'Réactive la dernière version qui était active avant l''actuelle.
        409 `no_previous_version` s''il n''y en a aucune. Audit : `model.activated`
        (rollback: true).'
      summary: Réactiver la version précédente (US48)
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelVersion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModelVersion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModelVersion'
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
  /api/admin/settings/:
    get:
      operationId: admin_settings_retrieve
      description: 'Singleton : seuils (`phishing_threshold`, `uncertain_lower`) et
        quotas (`daily_scan_quota`, `quick_check_hourly_limit`). Si la table est vide,
        les valeurs Django/env par défaut sont renvoyées. Lecture mise en cache 30
        s.'
      summary: Lire les réglages de détection (US52)
      tags:
      - admin
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionSettings'
          description: ''
    patch:
      operationId: admin_settings_partial_update
      description: 'PATCH partiel : seuls les champs fournis sont modifiés, puis le
        ensemble est validé (`0 < uncertain_lower < phishing_threshold <= 1`, quotas
        entiers >= 1 et bornés). Cache invalidé immédiatement. Audit : `settings.changed`
        (anciennes + nouvelles valeurs).'
      summary: Modifier les réglages de détection (US52)
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDetectionSettingsUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDetectionSettingsUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDetectionSettingsUpdate'
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionSettings'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
          description: ''
  /api/audit/logs/:
    get:
      operationId: audit_logs_list
      description: 'Journal d''audit : lecture seule, paginé, filtrable, réservé à
        l''administrateur.'
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - apikey.created
          - apikey.revoked
          - blocklist.added
          - blocklist.exported
          - blocklist.removed
          - blocklist_add
          - blocklist_remove
          - decision
          - integration.delivered
          - integration.delivery_failed
          - login_failed
          - login_success
          - model.activated
          - model_update
          - note.added
          - password.reset_completed
          - password.reset_requested
          - quick_check.created
          - register
          - report.created
          - role_change
          - scan.decided
          - scan.rescanned
          - scan_created
          - scan_status_changed
          - settings.changed
          - user_reactivate
          - user_suspend
        description: |-
          * `register` - Inscription
          * `login_success` - Connexion réussie
          * `login_failed` - Connexion échouée
          * `role_change` - Changement de rôle
          * `user_suspend` - Suspension d'un compte
          * `user_reactivate` - Réactivation d'un compte
          * `decision` - Décision
          * `blocklist_add` - Ajout à la blocklist
          * `blocklist_remove` - Retrait de la blocklist
          * `model_update` - Modèle
          * `scan_created` - Création d'un scan
          * `scan_status_changed` - Changement de statut d'un scan
          * `quick_check.created` - Quick check anonyme
          * `report.created` - Signalement d'un verdict
          * `scan.decided` - Décision d'un analyste
          * `note.added` - Note interne d'un analyste
          * `scan.rescanned` - Nouveau scan relancé par un analyste
          * `blocklist.added` - Ajout à la blocklist
          * `blocklist.removed` - Retrait de la blocklist
          * `blocklist.exported` - Export de la blocklist
          * `settings.changed` - Réglages de détection modifiés
          * `model.activated` - Version de modèle activée
          * `apikey.created` - Création d'une clé API
          * `apikey.revoked` - Révocation d'une clé API
          * `password.reset_requested` - Demande de réinitialisation
          * `password.reset_completed` - Mot de passe réinitialisé
          * `integration.delivery_failed` - Échec de livraison d'un événement d'intégration
          * `integration.delivered` - Livraison d'un événement d'intégration
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: user
        schema:
          type: number
      - in: query
        name: user_email
        schema:
          type: string
      tags:
      - audit
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/audit/logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: 'Journal d''audit : lecture seule, paginé, filtrable, réservé à
        l''administrateur.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - audit
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Mot de passe actuel incorrect ou nouveau mot de passe trop
            faible.
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Connexion JWT + journalisation des succès et des échecs.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Token invalide ou expiré.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        US5 - request a reset link. NEVER reveals whether the account exists.

        Always the same 202 + body (existing, unknown or suspended email); the
        lookup, the token and the email are done in the Celery task, so the
        response time does not leak the answer either.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      - {}
      responses:
        '202':
          description: Toujours 202, que l'email existe ou non.
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: US5 - set the new password with the emailed uid + token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Mot de passe réinitialisé.
        '400':
          description: Lien invalide ou expiré, ou mot de passe trop faible.
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.

        Step 8d: throttled, THROTTLE_REFRESH per IP (default 60/min), rate read
        from settings.REST_FRAMEWORK["DEFAULT_THROTTLE_RATES"].
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
