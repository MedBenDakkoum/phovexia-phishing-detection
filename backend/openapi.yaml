          * `reported` - Reported
      - in: query
        name: verdict
        schema:
          type: string
          nullable: true
          enum:
          - legitimate
          - phishing
          - uncertain
        description: |-
          * `phishing` - Phishing
          * `legitimate` - Legitimate
          * `uncertain` - Uncertain
      tags:
      - review
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewQueueItemList'
          description: ''
  /api/scans/:
    get:
      operationId: scans_list
      description: 'Uniquement mes scans, du plus récent au plus ancien, paginé. Filtres
        (US29) : `q` (sous-chaîne de l''URL ou du domaine, littérale), `verdict`,
        `status`, `created_after` et `created_before` (ISO 8601, bornes inclusives),
        combinés par ET. Une date seule `YYYY-MM-DD` couvre le jour entier dans le
        fuseau de `TIME_ZONE` (les deux jours bornes sont donc inclusifs). Tri : `ordering`
        limité à created_at, finished_at, status, verdict, score (un « - » pour le
        décroissant) ; toute autre valeur retombe sur le tri par défaut. Une valeur
        de filtre invalide renvoie 400 avant toute requête SQL.'
      summary: Lister mes scans (US16 / US29)
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -finished_at
          - -score
          - -status
          - -verdict
          - created_at
          - finished_at
          - score
          - status
          - verdict
        description: 'Tri de l''historique : l''un des champs autorisés (created_at,
          finished_at, status, verdict, score), précédé d''un « - » pour l''ordre
          décroissant. Une valeur hors liste retombe sur le tri par défaut (-created_at,
          -id).'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - analyzing
          - blocked
          - confirmed
          - detected
          - failed
          - false_positive
          - submitted
          - under_review
        description: |-
          * `submitted` - Submitted
          * `analyzing` - Analyzing
          * `detected` - Detected
          * `under_review` - Under Review
          * `confirmed` - Confirmed
          * `false_positive` - False Positive
          * `blocked` - Blocked
          * `failed` - Failed
      - in: query
        name: verdict
        schema:
          type: string
          nullable: true
          enum:
          - legitimate
          - phishing
          - uncertain
        description: |-
          * `phishing` - Phishing
          * `legitimate` - Legitimate
          * `uncertain` - Uncertain
      tags:
      - scans
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScanList'
          description: ''
    post:
      operationId: scans_create
      description: 'Valide l''URL (BR-07), applique le quota quotidien (BR-01), crée
        le scan en mode full et le file d''attente Celery (US15). Le corps ne peut
        contenir que `url` : mode, statut, verdict, score et propriétaire sont décidés
        par le serveur.'
      summary: Soumettre une URL (US12)
      tags:
      - scans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanCreate'
        required: true
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaExceeded'
          description: ''
  /api/scans/{public_id}/:
    get:
      operationId: scans_retrieve
      description: Identifié par l'UUID public (`id` de la réponse), jamais par la
        clé entière interne.
      summary: Détail d'un scan (US16)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scans
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Scan introuvable ou non visible par ce compte (404 volontaire,
            jamais 403).
  /api/scans/{public_id}/report/:
    post:
      operationId: scans_report_create
      description: 'Réservé au propriétaire du scan, qui doit être en `detected` ou
        `under_review` et sans signalement (BR-05 : un seul par scan, sinon 409).
        Un scan `detected` passe en `under_review` via le graphe BR-04. Le commentaire
        et le label revendiqués sont enregistrés ; une entrée `report.created` est
        écrite dans le journal d''audit.'
      summary: Signaler un verdict faux (US31)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportCreate'
        required: true
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Scan introuvable ou non possédé par ce compte (404).
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Conflit (409) : `code` = `already_reported` (BR-05), `not_reportable`
            (statut du scan) ou `not_decidable` (BR-04).'
  /api/scans/{public_id}/screenshot/:
    get:
      operationId: scans_screenshot_retrieve
      description: Renvoie le PNG capturé dans le bac à sable. Propriétaire, analyste
        ou admin ; un scan sans capture (ou fichier supprimé) renvoie 404. Le répertoire
        média n'est jamais exposé directement.
      summary: Capture d'écran d'un scan (US20)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scans
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: Capture PNG du scan (image/png).
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Scan introuvable ou non visible par ce compte (404 volontaire,
            jamais 403).
  /api/scans/quota/:
    get:
      operationId: scans_quota_retrieve
      description: 'Limites du jour : combien de scans restent disponibles.'
      summary: Mon quota de scans (US14)
      tags:
      - scans
      security:
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
          description: ''
