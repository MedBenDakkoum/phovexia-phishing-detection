components:
  schemas:
    ActionEnum:
      enum:
      - register
      - login_success
      - login_failed
      - role_change
      - user_suspend
      - user_reactivate
      - decision
      - blocklist_add
      - blocklist_remove
      - model_update
      - scan_created
      - scan_status_changed
      - quick_check.created
      - report.created
      - scan.decided
      - note.added
      - scan.rescanned
      - blocklist.added
      - blocklist.removed
      - blocklist.exported
      - settings.changed
      - model.activated
      - apikey.created
      - apikey.revoked
      - password.reset_requested
      - password.reset_completed
      - integration.delivery_failed
      - integration.delivered
      type: string
      description: |-
        * `register` - Inscription
        * `login_success` - Connexion réussie
        * `login_failed` - Connexion échouée
        * `role_change` - Changement de rôle
        * `user_suspend` - Suspension d'un compte
        * `user_reactivate` - Réactivation d'un compte
        * `decision` - Décision
        * `blocklist_add` - Ajout à la blocklist
        * `blocklist_remove` - Retrait de la blocklist
        * `model_update` - Modèle
        * `scan_created` - Création d'un scan
        * `scan_status_changed` - Changement de statut d'un scan
        * `quick_check.created` - Quick check anonyme
        * `report.created` - Signalement d'un verdict
        * `scan.decided` - Décision d'un analyste
        * `note.added` - Note interne d'un analyste
        * `scan.rescanned` - Nouveau scan relancé par un analyste
        * `blocklist.added` - Ajout à la blocklist
        * `blocklist.removed` - Retrait de la blocklist
        * `blocklist.exported` - Export de la blocklist
        * `settings.changed` - Réglages de détection modifiés
        * `model.activated` - Version de modèle activée
        * `apikey.created` - Création d'une clé API
        * `apikey.revoked` - Révocation d'une clé API
        * `password.reset_requested` - Demande de réinitialisation
        * `password.reset_completed` - Mot de passe réinitialisé
        * `integration.delivery_failed` - Échec de livraison d'un événement d'intégration
        * `integration.delivered` - Livraison d'un événement d'intégration
    AdminError:
